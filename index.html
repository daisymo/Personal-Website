    <style>
      #page-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: transparent;
        z-index: 9999;
        pointer-events: none;
      }
      #page-loader::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #6366f1, #8b5cf6, #6366f1);
        background-size: 200% 100%;
        animation: loading-progress 1.5s ease-in-out infinite, loading-fill 2s ease-out forwards;
      }
      @keyframes loading-progress {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      @keyframes loading-fill {
        0% { width: 0%; }
        80% { width: 85%; }
        100% { width: 100%; }
      }
      body.page-loaded #page-loader {
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }
      body.page-loaded #page-loader::after {
        animation: loading-fade 0.3s ease-out forwards;
      }
      @keyframes loading-fade {
        to { opacity: 0; }
      }
    </style>
    <div id="page-loader"></div>
  </body>
